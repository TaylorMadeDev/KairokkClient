plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
		content {
			includeGroup 'fuzs.forgeconfigapiport'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kairokk" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation files("libs/ModernUI-Fabric-${project.minecraft_version}-3.13.0.5-universal.jar")
	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.3"
	implementation "javazoom:jlayer:1.0.1"
	// Used only by the authenticated development launcher. Tokens are cached
	// outside the project and are never bundled into the client jar.
	implementation "net.raphimc:MinecraftAuth:5.0.2"
	include "javazoom:jlayer:1.0.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Authenticated development launch. The helper only writes a short-lived
// launch-argument file; the refresh token is kept under %LOCALAPPDATA%.
def kairokkAuthArgsFile = layout.buildDirectory.file("kairokk-auth.args")
def kairokkDashboardArgsFile = layout.buildDirectory.file("kairokk-dashboard.args")

tasks.register("authenticateMinecraft", JavaExec) {
	dependsOn tasks.named("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.kairokk.auth.KairokkAuthLauncher"
	args(kairokkAuthArgsFile.get().asFile.absolutePath)
}

tasks.register("linkKairokkDashboard", JavaExec) {
	dependsOn tasks.named("classes")
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.kairokk.auth.KairokkDashboardLinkLauncher"
	args(kairokkDashboardArgsFile.get().asFile.absolutePath)
}

tasks.named("runClient") {
	// These are appended after Loom's normal development arguments so the
	// authenticated profile replaces the offline development profile.
	doFirst {
		File argsFile = kairokkAuthArgsFile.get().asFile
		if (!argsFile.isFile()) {
			throw new GradleException("Authenticated profile was not created. Run authenticateMinecraft first.")
		}
		Properties profile = new Properties()
		argsFile.withInputStream { profile.load(it) }
		["username", "uuid", "accessToken", "version"].each { key ->
			String value = profile.getProperty(key)
			if (value == null || value.isBlank()) throw new GradleException("Missing authenticated Minecraft argument: " + key)
			args("--" + key, value)
		}
		String xuid = profile.getProperty("xuid")
		if (xuid != null && !xuid.isBlank()) args("--xuid", xuid)
		File dashboardFile = kairokkDashboardArgsFile.get().asFile
		if (dashboardFile.isFile()) {
			Properties link = new Properties()
			dashboardFile.withInputStream { link.load(it) }
			["backend", "clientAccessToken", "deviceFingerprintHash", "deviceId"].each { key ->
				String value = link.getProperty(key)
				if (value != null && !value.isBlank()) systemProperty("kairokk." + key, value)
			}
		}
		String quickPlayWorld = System.getenv("KAIROKK_QUICK_PLAY_WORLD")
		if (quickPlayWorld != null && !quickPlayWorld.isBlank()) {
			args("--quickPlaySingleplayer", quickPlayWorld)
		}
	}
}

tasks.register("runAuthenticatedClient") {
	group = "fabric"
	description = "Authenticate with Microsoft (once) and launch the Kairokk development client."
	dependsOn tasks.named("authenticateMinecraft")
	dependsOn tasks.named("linkKairokkDashboard")
	dependsOn tasks.named("runClient")
}
tasks.named("runClient").configure {
	mustRunAfter tasks.named("authenticateMinecraft")
	mustRunAfter tasks.named("linkKairokkDashboard")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
